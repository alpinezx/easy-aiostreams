<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<title>Sign in - Easy AIOStreams Control Panel</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/js/theme.js"></script>
<!-- Until the stylesheet has loaded: the page's colour, and nothing drawn on it, so a slow load never flashes a white page with a black logo. app.css shows the page; after 4s it shows anyway, should the stylesheet never come -->
<style>html{background:#070707;color-scheme:dark}@media (prefers-color-scheme:light){html:not([data-theme]){background:#e4e7eb;color-scheme:light}}html:is([data-theme=light],[data-theme=latte],[data-theme=ghlight],[data-theme=solarlight],[data-theme=gruvlight],[data-theme=everlight],[data-theme=tokyoday],[data-theme=novel],[data-theme=aerogel],[data-theme=basic],[data-theme=material],[data-theme=onelight],[data-theme=dawn]){background:#e4e7eb;color-scheme:light}body{visibility:hidden;animation:aios-show 0s 4s forwards}@keyframes aios-show{to{visibility:visible}}</style>
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="bare">
<div class="login-wrap">
  <div class="login">
    <div class="login-head">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="logo-tile" width="32" height="32" rx="8" fill="#f2f2f2"/><path class="logo-line" d="M5 17h5l3-7 5 13 3-6h6" fill="none" stroke="#0b0b0b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>Sign in</h1>
      <p>Easy AIOStreams control panel</p>
    </div>
    <form id="f" autocomplete="on">
      <label>Username
        <input class="input" name="username" autocomplete="username" placeholder="Enter your username" required autofocus>
      </label>
      <label>Password
        <span class="pw">
          <input class="input" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          <button class="pw-eye" id="pw-eye" type="button" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M3 3l18 18"/></svg></button>
        </span>
      </label>
      <p class="err" id="err" role="alert"></p>
      <button class="btn primary" type="submit" id="go">Sign in</button>
    </form>
  </div>
</div>
<script type="module" src="/js/login.js"></script>
</body>
</html>
