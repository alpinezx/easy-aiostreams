<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign in - Easy AIOStreams Control Panel</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="login-wrap">
  <div class="login">
    <div>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#f2f2f2"/><path d="M5 17h5l3-7 5 13 3-6h6" fill="none" stroke="#0b0b0b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Easy AIOStreams</span>
      </div>
      <p>Control Panel. Sign in to manage your AIOStreams server.</p>
    </div>
    <form id="f" autocomplete="on">
      <label>Username
        <input class="input" name="username" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input class="input" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="err" id="err" role="alert"></p>
      <button class="btn primary" type="submit" id="go">Sign in</button>
    </form>
  </div>
</div>
<script type="module" src="/js/login.js"></script>
</body>
</html>
